```html
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"<
<title>Fiche médicale - MediQR</title>
<style>
body{font-family:Arial,sans-serif;background:#f0f7f7;margin:0;padding:20px;color:#243746}
.card{max-width:500px;margin:30px auto;background:white;padding:25px;border-radius:18px;box-shadow:0 4px 18px #00000012}
h1{text-align:center;color:#087f8c}
.subtitle{text-align:center;color:#667788}
.item{padding:13px 0;border-bottom:1px solid #e5eeee}
.label{font-weight:bold;display:block;margin-bottom:5px}
.notice{background:#fff4d6;padding:12px;border-radius:10px;font-size:13px;margin-top:20px}
footer{text-align:center;margin-top:20px;color:#667788;font-size:12px}
a{color:#087f8c}
</style>
</head>
<body>
<main class="card">
<h1>💚 MediQR</h1>
<p class="subtitle">Fiche médicale de démonstration</p>
<div id="profile"></div>
<div class="notice"><strong>Important :</strong> projet scolaire avec des données fictives. Cette fiche ne doit pas être utilisée en situation d'urgence.</div>
<p><a href="./index.html">← Retour au site MediQR</a></p>
<footer>MediQR — Prototype scolaire</footer>
</main>
<script>
const patients = {
"1": {
name: "Sara Exemple",
blood: "Non renseigné",
allergies: "Non renseignées",
info: "Aucune donnée médicale réelle.",
contact: "Non renseigné"
},
"2": {
name: "Adam Démo",
blood: "O+ (exemple fictif)",
allergies: "Exemple fictif : arachides",
info: "Exemple scolaire uniquement.",
contact: "Non renseigné"
},
"3": {
name: "Lina Test",
blood: "A+ (exemple fictif)",
allergies: "Exemple fictif : pollen",
info: "Exemple scolaire uniquement.",
contact: "Non renseigné"
}
};
const params = new URLSearchParams(window.location.search);
const id = params.get("id") || "1";
const p = patients[id];
const profile = document.getElementById("profile");

if (p) {
profile.innerHTML = `     <div class="item"><span class="label">👤 Nom du patient</span>${p.name}</div>     <div class="item"><span class="label">🩸 Groupe sanguin</span>${p.blood}</div>     <div class="item"><span class="label">⚠️ Allergies</span>${p.allergies}</div>     <div class="item"><span class="label">💊 Informations médicales</span>${p.info}</div>     <div class="item"><span class="label">📞 Contact d'urgence</span>${p.contact}</div>
  `;
} else {
profile.textContent = "Profil introuvable. Vérifiez le QR code.";
} </script>

</body>
</html>
